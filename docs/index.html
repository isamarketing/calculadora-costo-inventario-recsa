<style>
:root{--bg:#0a0e1a;--s1:#111827;--s2:#1a2235;--bd:#2a3450;--tx:#e8ecf4;--t2:#8899b4;--ac:#4f8cff;--gn:#00d4aa;--rd:#ff4d6a;--or:#ffb84d;--pu:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.header{background:linear-gradient(135deg,#0d1117,#1a2235);border-bottom:1px solid var(--bd);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-size:18px;font-weight:700}.header h1 span{color:var(--ac)}
.btn-sm{padding:6px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font-family:"DM Sans";font-size:12px;cursor:pointer}
.btn-sm:hover{border-color:var(--ac);color:var(--ac)}
.btn-load{padding:6px 14px;border-radius:6px;border:1px solid var(--ac);background:rgba(79,140,255,.1);color:var(--ac);font-family:"DM Sans";font-size:12px;font-weight:600;cursor:pointer}
.btn-load:hover{background:var(--ac);color:#fff}
.kpi-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:12px 24px;background:var(--s1);border-bottom:1px solid var(--bd)}
.kpi{text-align:center}.kpi .lb{font-size:9px;color:var(--t2);text-transform:uppercase;letter-spacing:1px}.kpi .vl{font-family:"JetBrains Mono";font-size:16px;font-weight:600;margin-top:2px}
.main{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - 130px)}
.tbl-section{padding:16px;overflow:auto}
.sidebar{background:var(--s1);border-left:1px solid var(--bd);padding:16px;overflow-y:auto}
.sidebar h3{font-size:13px;margin-bottom:12px;color:var(--or)}
.card{background:var(--s2);border-radius:8px;padding:14px;margin-bottom:10px;border:1px solid var(--bd)}
.card h4{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.sr{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}.sr .lb{color:var(--t2)}.sr .vl{font-family:"JetBrains Mono";font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--s2);color:var(--t2);font-weight:600;padding:8px;text-align:left;position:sticky;top:0;z-index:2;border-bottom:2px solid var(--bd);font-size:10px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody td{padding:5px 8px;border-bottom:1px solid rgba(42,52,80,.4);vertical-align:middle}
tbody tr:hover{background:rgba(79,140,255,.04)}
.mono{font-family:"JetBrains Mono";font-size:11px}
input[type=range]{width:70px;height:4px;-webkit-appearance:none;background:var(--bd);border-radius:2px;outline:none;cursor:pointer;vertical-align:middle}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--ac);border-radius:50%;cursor:pointer}
.pv{font-family:"JetBrains Mono";font-size:10px;color:var(--ac);min-width:28px;display:inline-block;text-align:right}
.gc{padding:12px 24px;background:var(--s2);border-bottom:1px solid var(--bd);display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.gc label{font-size:12px;color:var(--t2)}
.gc input[type=number]{width:80px;background:var(--s1);border:1px solid var(--bd);color:var(--ac);padding:4px 8px;border-radius:4px;font-family:"JetBrains Mono";font-size:12px;text-align:right}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters select,.filters input{background:var(--s2);border:1px solid var(--bd);color:var(--tx);padding:6px 10px;border-radius:6px;font-family:"DM Sans";font-size:12px}
.filters input{flex:1;min-width:120px}
</style>
</head>

<div class="header">
  <div><h1>Costo Financiero <span>Inventario</span> — RECSA</h1><div style="color:var(--t2);font-size:11px;margin-top:2px">Cálculo de costo financiero por producto basado en stock standard · <span id="dataSource" style="color:var(--ac)">Datos base</span></div></div>
  <div style="display:flex;gap:8px">
    <label class="btn-load" onclick="document.getElementById('fileIn').click()">📂 Cargar Excel</label>

<div class="gc">

</div>
<div class="kpi-bar" id="kpis"></div>
<div class="main">

function gTNA(){return parseFloat(document.getElementById("gTNA").value)/100}
function gTC(){return parseFloat(document.getElementById("gTC").value)||1490}
function gVol(){return parseFloat(document.getElementById("gVol").value)||29379}

function ci(s){
  var sd=s.lt+s.ss;
  var sk=s.v>0?(s.v/365)*sd:0;
  var su=sk*s.d;
  var t=gTNA();
  var cfd=s.v>0?(su*t)/(s.v*365):0;
  var cfs=cfd*sd;
  var cfp=s.d>0?cfs/s.d:0;
  var cfa=cfs*s.v;
  return {sd:sd,sk:sk,su:su,cfd:cfd,cfs:cfs,cfp:cfp,cfa:cfa};
}

function fmt(n){return Math.abs(n).toLocaleString("es-AR",{maximumFractionDigits:0})}
function fd(n){return n.toFixed(2)}
function fd4(n){return n.toFixed(4)}

function updateG(){
  document.getElementById("gTNAv").textContent=(gTNA()*100).toFixed(1)+"%";
  renderAll();
}

function ui(idx,f,val){S[idx][f]=parseInt(val);renderAll();}
function uv(idx,val){S[idx].v=parseFloat(val)||0;renderAll();}

function initFilters(){
  var lines={};for(var i=0;i<S.length;i++)lines[S[i].l]=1;
  var sel=document.getElementById("fLine");
  Object.keys(lines).sort().forEach(function(l){if(l){var o=document.createElement("option");o.value=l;o.textContent=l;sel.appendChild(o);}});
}

function getFiltered(){
  var fl=document.getElementById("fLine").value;
  var fs=document.getElementById("fSearch").value.toLowerCase();
  var r=[];
  for(var i=0;i<S.length;i++){
    var s=S[i];
    if(fl!=="ALL"&&s.l!==fl)continue;
    if(fs&&(s.p+s.l).toLowerCase().indexOf(fs)<0)continue;
    r.push({s:s,i:i});
  }
  return r;
}

function renderAll(){renderKPIs();renderTable();renderSB();}

function renderKPIs(){
  var tsu=0,tcf=0,tv=0,nc=0;
  for(var i=0;i<S.length;i++){var c=ci(S[i]);tsu+=c.su;tcf+=c.cfa;tv+=S[i].v;if(c.sk>0)nc++;}
  var cpk=tv>0?tcf/tv:0;
  var cma=(tcf/12)*gTC();
  var h="";
  h+='<div class="kpi"><div class="lb">Stock Inmovilizado</div><div class="vl" style="color:var(--or)">USD '+fmt(tsu)+'</div></div>';
  h+='<div class="kpi"><div class="lb">CF Anual</div><div class="vl" style="color:var(--rd)">USD '+fmt(tcf)+'</div></div>';
  h+='<div class="kpi"><div class="lb">CF Promedio USD/kg</div><div class="vl" style="color:var(--rd)">USD '+fd(cpk)+'</div></div>';
  h+='<div class="kpi"><div class="lb">CF Mensual ARS</div><div class="vl" style="color:var(--rd)">ARS '+fmt(cma)+'</div></div>';
  h+='<div class="kpi"><div class="lb">Con Stock</div><div class="vl">'+nc+' / '+S.length+'</div></div>';
  document.getElementById("kpis").innerHTML=h;
}

function renderTable(){
  var items=getFiltered();
  var h='<table><thead><tr><th>Línea</th><th>Producto</th><th>Origen</th><th style="text-align:right">Vol Anual</th><th>Lead Time</th><th>Stock Seg</th><th>Std (días)</th><th style="text-align:right">Stock kg</th><th style="text-align:right">MP USD</th><th style="text-align:right">Stock USD</th><th style="text-align:right">CF/kg</th><th>%MP</th><th style="text-align:right">CF Anual</th></tr></thead><tbody>';
  for(var j=0;j<items.length;j++){
    var s=items[j].s,i=items[j].i,c=ci(s);
    var cc=c.cfs>1?"var(--rd)":c.cfs>0.5?"var(--or)":"var(--gn)";
    h+="<tr>";
    h+='<td style="font-size:10px;color:var(--t2)">'+s.l+'</td>';
    h+='<td style="font-weight:500">'+s.p+'</td>';
    h+='<td style="font-size:10px;color:var(--t2)">'+s.o+'</td>';
    h+='<td><input type="number" value="'+s.v+'" onchange="uv('+i+',this.value)" style="width:70px;background:var(--s1);border:1px solid var(--bd);color:var(--ac);padding:2px 6px;border-radius:4px;font-family:JetBrains Mono;font-size:11px;text-align:right"></td>';
    h+='<td><input type="range" min="0" max="120" value="'+s.lt+'" oninput="ui('+i+',\'lt\',this.value)"><span class="pv">'+s.lt+'d</span></td>';
    h+='<td><input type="range" min="0" max="90" value="'+s.ss+'" oninput="ui('+i+',\'ss\',this.value)"><span class="pv">'+s.ss+'d</span></td>';
    h+='<td class="mono" style="text-align:center">'+c.sd+'</td>';
    h+='<td class="mono" style="text-align:right">'+fmt(c.sk)+'</td>';
    h+='<td class="mono" style="text-align:right">'+fd(s.d)+'</td>';
    h+='<td class="mono" style="text-align:right;color:var(--or)">'+fmt(c.su)+'</td>';
    h+='<td class="mono" style="text-align:right;color:'+cc+'">'+fd(c.cfs)+'</td>';
    h+='<td class="mono" style="color:'+cc+'">'+(c.cfp*100).toFixed(1)+'%</td>';
    h+='<td class="mono" style="text-align:right;color:var(--rd)">'+fmt(c.cfa)+'</td>';
    h+="</tr>";
  }
  h+="</tbody></table>";
  document.getElementById("tbl").innerHTML=h;
}

function renderSB(){
  var bo={},bl={},top=[];
  for(var i=0;i<S.length;i++){var s=S[i],c=ci(s);
    var o=s.o||"N/A";if(!bo[o])bo[o]={su:0,cf:0,n:0};bo[o].su+=c.su;bo[o].cf+=c.cfa;bo[o].n++;
    var l=s.l||"OTROS";if(!bl[l])bl[l]={su:0,cf:0,n:0};bl[l].su+=c.su;bl[l].cf+=c.cfa;bl[l].n++;
    if(c.cfa>0)top.push({p:s.p,cf:c.cfa,ck:c.cfs});}
  top.sort(function(a,b){return b.cf-a.cf});

  var h='<h3>Resumen</h3>';
  h+='<div class="card"><h4>Por Línea</h4>';
  var lks=Object.keys(bl).sort(function(a,b){return bl[b].su-bl[a].su});
  for(var i=0;i<lks.length;i++){var k=lks[i],d=bl[k];h+='<div class="sr"><span class="lb">'+k+' ('+d.n+')</span><span class="vl" style="color:var(--or)">USD '+fmt(d.su)+'</span></div>';}
  h+='</div>';
  
  h+='<div class="card"><h4>Por Origen</h4>';
  var oks=Object.keys(bo).sort(function(a,b){return bo[b].su-bo[a].su});
  for(var i=0;i<oks.length;i++){var k=oks[i],d=bo[k];h+='<div class="sr"><span class="lb">'+k+' ('+d.n+')</span><span class="vl" style="color:var(--or)">USD '+fmt(d.su)+'</span></div>';}
  h+='</div>';

  h+='<div class="card"><h4>Top Costo Financiero</h4>';
  for(var i=0;i<Math.min(top.length,8);i++){var p=top[i];h+='<div class="sr"><span class="lb" style="font-size:11px">'+p.p.substring(0,25)+'</span><span class="vl" style="color:var(--rd);font-size:11px">'+fmt(p.cf)+' ('+fd(p.ck)+'/kg)</span></div>';}
  h+='</div>';

  h+='<div class="card"><h4>Fórmulas</h4><div style="font-size:10px;color:var(--t2);line-height:1.6">Stock Std = LT + SS<br>Stock kg = (Vol/365) × Std<br>Stock USD = kg × MP<br>CF Diario = (Stock USD × TNA) / (Vol × 365)<br>CF/kg = Diario × Std días<br>CF Anual = CF/kg × Vol</div></div>';
  
  h+='<button class="btn-sm" style="width:100%;margin-top:12px;padding:10px;background:var(--ac);color:#fff;border:none;font-weight:600" onclick="exportCSV()">📥 Export CSV</button>';
  document.getElementById("sb").innerHTML=h;
}

function loadExcel(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:0,raw:true});
      if(rows.length<2)throw new Error("Vacío");
      var hdrs=rows[0].map(function(h){return String(h||"").toLowerCase().trim()});
      var cm={};
      hdrs.forEach(function(h,i){
        if(h.includes("línea")||h.includes("linea"))cm.l=i;
        else if(h.includes("producto"))cm.p=i;
        else if(h.includes("origen"))cm.o=i;
        else if(h.includes("vol"))cm.v=i;
        else if(h.includes("lead"))cm.lt=i;
        else if(h.includes("stock seg")||h.includes("seguridad"))cm.ss=i;
        else if(h.includes("mp")||h.includes("ddp")||h.includes("costo"))cm.d=i;
      });
      var newS=[];
      for(var r=1;r<rows.length;r++){
        var row=rows[r];var prod=String(row[cm.p]||"").trim();if(!prod)continue;
        var pf=function(v){var n=parseFloat(v);return isNaN(n)?0:Math.abs(n)};
        newS.push({p:prod,l:cm.l!==undefined?String(row[cm.l]||"").trim():"",o:cm.o!==undefined?String(row[cm.o]||"").trim():"LOCAL",v:pf(row[cm.v]),lt:cm.lt!==undefined?Math.round(pf(row[cm.lt])):30,ss:cm.ss!==undefined?Math.round(pf(row[cm.ss])):15,d:pf(row[cm.d])});
      }
      if(newS.length>0){S=newS;document.getElementById("dataSource").textContent="Excel: "+file.name+" ("+newS.length+")";document.getElementById("dataSource").style.color="var(--gn)";initFilters();renderAll();}
    }catch(err){alert("Error: "+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

function exportCSV(){
  var csv="Línea,Producto,Origen,Vol Anual,Lead Time,Stock Seg,Std Días,Stock Kg,MP USD,Stock USD,TNA,CF/kg,% MP,CF Anual\n";
  for(var i=0;i<S.length;i++){var s=S[i],c=ci(s);csv+='"'+s.l+'","'+s.p+'","'+s.o+'",'+s.v+','+s.lt+','+s.ss+','+c.sd+','+c.sk.toFixed(1)+','+s.d.toFixed(2)+','+c.su.toFixed(0)+','+(gTNA()*100).toFixed(1)+','+c.cfs.toFixed(4)+','+(c.cfp*100).toFixed(1)+','+c.cfa.toFixed(0)+"\n";}
  var b=new Blob([csv],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="RECSA_inventario_cf_"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

initFilters();
renderAll();
</script>
</body>
</html>
